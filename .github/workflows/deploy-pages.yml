# Publishes only the current game runtime; repository archives stay out of the public site.
name: Deploy clean GitHub Pages site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run syntax, system and browser checks
        env:
          CODEX_PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright
        run: |
          node --check game.js
          node --check cloud-save.js
          node --check v2-systems.js
          node tests/numeric-balance.test.js
          node tests/usability-flow.test.js
          node tests/retention-flow.test.js
          node tests/daily-route.test.js
          node tests/doctrine-build.test.js
          node tests/season.test.js
          node tests/companion-story.test.js
          node tests/save-migration-v200.test.js
          node tests/browser-smoke.test.js
          node tests/mobile-performance.test.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare public game files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html styles.css game.js game-math.js v2-systems.js _site/
          cp -R assets/. _site/assets/

          for optional_file in firebase-config.js cloud-save.js; do
            if [[ -f "$optional_file" ]]; then
              cp "$optional_file" _site/
            fi
          done

          find . -maxdepth 1 -type f -name 'google*.html' -exec cp '{}' _site/ ';'
          touch _site/.nojekyll

          echo "Public artifact contents:"
          find _site -type f -print | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages may remain queued for more than the action's default 10 minutes.
          timeout: 1200000
