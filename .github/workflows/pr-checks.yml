name: Game PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble@sha256:b27e719ecbfef153e13fd24e8341736733bf2658b229677eb21ff57ff5d7fb29
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install isolated browser test runtime
        run: |
          npm install --no-save playwright@1.55.0 eslint@9.39.5 globals@17.14.0
          node <<'JS'
          const assert = require('node:assert/strict'), fs = require('node:fs'), p = require('playwright');
          assert.equal(Number(process.versions.node.split('.')[0]), 22);
          assert.equal(require('playwright/package.json').version, '1.55.0');
          for (const engine of ['chromium', 'webkit']) assert.ok(fs.existsSync(p[engine].executablePath()), engine + ' preinstalled browser');
          console.log(JSON.stringify({ node: process.version, playwright: '1.55.0', browsers: ['chromium', 'webkit'] }));
          JS
      - name: Lint shipped game scripts
        run: node scripts/lint.cjs
      - name: Verify systems and browser flows
        env:
          CODEX_PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright
        run: node scripts/check.cjs

  webkit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble@sha256:b27e719ecbfef153e13fd24e8341736733bf2658b229677eb21ff57ff5d7fb29
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install isolated browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          node <<'JS'
          const assert = require('node:assert/strict'), fs = require('node:fs'), p = require('playwright');
          assert.equal(Number(process.versions.node.split('.')[0]), 22);
          assert.equal(require('playwright/package.json').version, '1.55.0');
          for (const engine of ['chromium', 'webkit']) assert.ok(fs.existsSync(p[engine].executablePath()), engine + ' preinstalled browser');
          console.log(JSON.stringify({ node: process.version, playwright: '1.55.0', browsers: ['chromium', 'webkit'] }));
          JS
      - name: Verify v3 flows in WebKit
        env:
          CODEX_PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright
          V3_BROWSER_ENGINE: webkit
        run: node tests/v3-browser.test.js
      - name: Verify v3 visual and motion flows in WebKit
        env:
          CODEX_PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright
          V3_BROWSER_ENGINE: webkit
        run: node tests/v3-visual.test.js

  rules:
    # Firestore security rules against the local emulator only (demo- project, no production access).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install emulator test runtime
        run: npm install --no-save firebase-tools@14.27.0 @firebase/rules-unit-testing@4.0.1 firebase@11.10.0
      - name: Verify Firestore rules in emulator
        run: npx firebase emulators:exec --only firestore --project demo-stellar-rules "node tests/rules/firestore-rules.cjs"
