<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080f15" />
    <meta
      name="description"
      content="从一艘拾荒无人机出发，选择航线、探索残骸、修复归航星港。"
    />
    <title>拾荒航线 · 星港拾荒者</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23edbb75' stroke-width='2'/%3E%3Cpath d='M2 24 30 8' stroke='%23edbb75' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css?v=3.1.0-preview.1" />
    <script defer src="data.js?v=3.1.0-preview.1"></script>
    <script defer src="engine.js?v=3.1.0-preview.1"></script>
    <script defer src="storage.js?v=3.1.0-preview.1"></script>
    <script defer src="app.js?v=3.1.0-preview.1"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到游戏内容</a>
    <header class="topbar">
      <div class="brand">
        <svg aria-hidden="true" viewBox="0 0 48 40">
          <circle cx="24" cy="20" r="14" />
          <path d="M3 29 45 11" />
          <circle cx="43" cy="11" r="2" />
        </svg>
        <div>拾荒航线<span>SALVAGE / ORBIT</span></div>
      </div>
      <div class="resources">
        <div>
          <span class="dust-mark" aria-hidden="true">◈</span
          ><strong id="dust-value">0</strong
          ><span class="resource-name">星尘</span>
        </div>
        <div class="rate-label">
          生产 <strong id="rate-value">+0 / 秒</strong>
        </div>
        <div id="core-resource" hidden>
          星核 <strong id="core-value">0</strong>
        </div>
      </div>
      <button id="settings-button" class="text-button" type="button">
        设置
      </button>
    </header>
    <div class="shell">
      <nav id="navigation" aria-label="航站导航"></nav>
      <main id="main" tabindex="-1"><p class="loading">正在接续航线……</p></main>
    </div>
    <footer>
      <span id="run-label">第 1 航次</span><span id="route-label">工业航线</span
      ><span id="save-label">自动保存</span>
    </footer>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button
          id="dialog-close"
          class="text-button"
          type="button"
          aria-label="关闭"
        >
          ×
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <noscript>启航需要启用 JavaScript。原始航站记录仍保存在本机。</noscript>
  </body>
</html>
